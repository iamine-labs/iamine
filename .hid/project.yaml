schema_version: "0.0.2"

project:
  id: iamine
  integration_branch: develop

mode:
  name: shadow
  enforcement: false
  canonical_workflow_wins: true

canonical_authority:
  agent_rules: AGENTS.md
  workflow: docs/process/iamine-canonical-workflow.md
  context: docs/process/iamine-context-consolidation.md
  product_roadmap: docs/roadmap/iamine-product-roadmap.md
  agent_network_roadmap: docs/roadmap/iamine-agent-network-roadmap.md

authority:
  intent: human
  priority: human
  product_scope: human
  architecture_exception: human
  risk_acceptance: human
  destructive_operation: human
  merge: human
  release: human
  milestone_closure: human
  public_claim: human
  silence_is_authorization: false

human_gates:
  architecture:
    action: development_authorization
    artifact_bound: true
  final_review:
    action: architecture_merge_approval
    artifact_bound: true
  human_merge:
    action: merge
    artifact_bound: true

state_requirements:
  LOCAL VALIDATION PASSED:
    gates:
      local_validation: passed
  ARCHITECTURE REVIEW REQUIRED:
    gates:
      local_validation: passed
  READY FOR MERGE REVIEW:
    gates:
      local_validation: passed
  APPROVED FOR MERGE:
    required_gates: passed
    gates:
      local_validation: passed
      final_review: passed
      human_merge: passed
  MERGED:
    required_gates: passed
    gates:
      local_validation: passed
      final_review: passed
      human_merge: passed
    events:
      - merged
  POST-MERGE VALIDATION:
    required_gates: passed
    gates:
      local_validation: passed
      final_review: passed
      human_merge: passed
    events:
      - merged
      - post_merge_validation_passed
  MERGED / VALIDATED / CLOSED:
    required_gates: passed
    gates:
      local_validation: passed
      final_review: passed
      human_merge: passed
    events:
      - merged
      - post_merge_validation_passed
      - feature_closed

data_semantics:
  SOURCE:
    - human intent and approved scope
    - architecture decisions and risk acceptance
    - explicit human authorization
  DERIVED:
    - current Git identity and ancestry
    - evidence status and next action
  SNAPSHOT:
    - Git identity at a recorded event or validation
    - environment and bounded test result

lifecycle:
  source: docs/process/iamine-canonical-workflow.md
  representation: derived_at_validation

failure_classes:
  - product
  - baseline
  - harness
  - infrastructure
  - test_gap
  - unknown

risk_levels:
  RISK_0: documentation or trivial local change
  RISK_1: local and reconstructible change
  RISK_2: backend, database, or API change
  RISK_3: security, distributed runtime, or release change

risk_gates:
  enforcement: false
  purpose: observe_required_review_and_validation

model_routing:
  enforced: false
  must_capture_when_available:
    - task_type
    - risk
    - model_or_profile_used
  useful_if_available:
    - complexity
    - context_size
    - tokens
    - escalation
    - rework
  deferred:
    - total_cost_optimizer
    - automatic_selection
    - historical_optimization
  profiles:
    - FAST
    - BALANCED
    - DEEP
  mappings: not_configured
  missing_measurement: not_measured

events:
  append_only: policy
  verification: baseline_prefix_when_available
  baseline_unavailable: visible_not_checked
  allowed:
    - feature_received
    - feature_triaged
    - scope_defined
    - scope_changed
    - scope_approved
    - architecture_started
    - architecture_approved
    - architecture_changes_required
    - implementation_started
    - implementation_completed
    - artifact_captured
    - validation_started
    - validation_passed
    - validation_failed
    - field_qa_started
    - field_qa_passed
    - field_qa_blocked
    - failure_classified
    - gate_state_corrected
    - changes_completed
    - replanning_requested
    - replanning_completed
    - human_decision_requested
    - human_authorization
    - merged
    - post_merge_validation_passed
    - feature_closed

privacy:
  policy: .hid/privacy.yaml
  automatic_redaction: false

metrics:
  missing_value: not_measured
  no_improvement_claims_without_evidence: true
