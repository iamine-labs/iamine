schema_version: "0.0.1"

project:
  id: iamine
  integration_branch: develop

mode:
  name: shadow
  enforcement: false
  canonical_workflow_wins: true

canonical_authority:
  agent_rules: AGENTS.md
  workflow: docs/process/iamine-canonical-workflow.md
  context: docs/process/iamine-context-consolidation.md
  product_roadmap: docs/roadmap/iamine-product-roadmap.md
  agent_network_roadmap: docs/roadmap/iamine-agent-network-roadmap.md

authority:
  intent: human
  priority: human
  product_scope: human
  architecture_exception: human
  risk_acceptance: human
  destructive_operation: human
  merge: human
  release: human
  milestone_closure: human
  public_claim: human
  silence_is_authorization: false

git:
  track_base_sha: true
  track_head_sha: true
  track_tree: true
  track_dirty_status: true
  evidence_binds_to_tree: true
  tree_change_marks_evidence_stale: true

lifecycle:
  source: docs/process/iamine-canonical-workflow.md
  canonical_states:
    - PROPOSED
    - ARCHITECTURE IN PROGRESS
    - ARCHITECTURE APPROVED
    - DEVELOPMENT AUTHORIZED
    - IMPLEMENTATION IN PROGRESS
    - IMPLEMENTATION COMPLETE
    - LOCAL VALIDATION PASSED
    - ARCHITECTURE REVIEW REQUIRED
    - FIELD QA AUTHORIZED
    - FIELD QA IN PROGRESS
    - QA BLOCKED
    - CHANGES REQUIRED
    - READY FOR MERGE REVIEW
    - APPROVED FOR MERGE
    - MERGED
    - POST-MERGE VALIDATION
    - MERGED / VALIDATED / CLOSED

failure_classes:
  - product
  - baseline
  - harness
  - infrastructure
  - test_gap
  - unknown

risk_levels:
  - RISK_0
  - RISK_1
  - RISK_2
  - RISK_3

risk_gates:
  enforcement: false
  purpose: observe_required_review_and_validation

intake:
  decisions:
    - accepted_current
    - future_milestone
    - replanning
    - deferred
    - rejected
  relationships:
    - supersedes
    - depends_on
    - replaces
    - blocks

model_routing:
  enforced: false
  profiles:
    - FAST
    - BALANCED
    - DEEP
  mappings: not_configured
  missing_measurement: not_measured

events:
  append_only: true
  allowed:
    - feature_received
    - feature_triaged
    - scope_defined
    - scope_changed
    - scope_approved
    - architecture_started
    - architecture_approved
    - architecture_changes_required
    - implementation_started
    - implementation_completed
    - validation_started
    - validation_passed
    - validation_failed
    - field_qa_started
    - field_qa_passed
    - field_qa_blocked
    - failure_classified
    - replanning_requested
    - replanning_completed
    - human_decision_requested
    - human_merge_authorized
    - merged
    - post_merge_validation_passed
    - feature_closed

privacy:
  store_prompt_content: false
  store_secret_values: false
  store_personal_paths: false
  store_hostnames: false
  store_ip_addresses: false
  store_machine_identifiers: false

metrics:
  missing_value: not_measured
  no_improvement_claims_without_evidence: true
