intent:
  data_class: SOURCE
  problem: An operator who already scoped a photo-library organization question cannot obtain a bounded, non-destructive review of a declared redacted inventory without exposing the photo library to the agent.
  expected_outcome: A bounded local_readonly review of operator-supplied redacted inventory metadata that refuses or hands off every filesystem, media, metadata-extraction, and execution request.

state:
  data_class: SNAPSHOT
  operational_authority: non_authoritative_legacy
  current: PROPOSED
  authority: human_onboarding_preparation_only

scope:
  data_class: SOURCE
  include:
    - the feature architecture contract, the QA plan, and bounded roadmap status notes
    - feature registration and mandate extension only under separate governance authority
    - agents/official/photo-library-organizer package and its seven referenced policy documents
    - iamine-node/src/photo_library_organizer_agent bounded local_readonly agent module
    - bounded CLI wiring for the agent task class, limited to the architecture contract allow-list
  exclude:
    - filesystem discovery, enumeration, reads, traversal, and symlink following
    - image bytes, thumbnails, and media hashes
    - EXIF, XMP, IPTC, GPS, face, person, location, OCR, vision, and embedding analysis
    - duplicate detection by image content
    - file modification, transfer, recovery, renaming, deletion, tagging, and transcoding
    - cloud, LAN share, camera, device, account, and credential handling
    - shell execution, child processes, and privilege expansion
    - shared runtime, iamine-agent-runtime, iamine-agents, and iamine-core changes
    - the shared official_agent_execution composition
    - model execution, scheduling, transport, worker lifecycle, and inference behavior
    - dashboard, client, packaging, registry, marketplace, and public beta behavior
    - Development authorization, implementation, and merge for this subject

