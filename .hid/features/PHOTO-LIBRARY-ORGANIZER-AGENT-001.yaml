  data_class: SOURCE
  level: RISK_2
  reasons:
    - the future implementation adds a new executable local agent surface and CLI task type to the node backend
    - field QA will be required before merge review
    - this registration grants no execution, review, or merge authority
    - no shared runtime, network, filesystem, model, or media surface is authorized

