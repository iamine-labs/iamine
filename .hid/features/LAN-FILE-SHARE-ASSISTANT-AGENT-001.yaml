  data_class: SNAPSHOT
  operational_authority: non_authoritative_legacy
  current: PROPOSED
  authority: human_onboarding_preparation_only

scope:
  data_class: SOURCE
  include:
    - agents/official/lan-file-share-assistant package and its seven referenced policy documents
    - iamine-node/src/lan_file_share_assistant_agent bounded local_readonly agent module
    - bounded CLI wiring for the agent task class, limited to the architecture contract allow-list
    - the feature architecture contract, the QA plan, and bounded roadmap status notes
    - feature registration and mandate extension only under separate governance authority
  exclude:
    - filesystem discovery, file access, share mounting, and share probing
    - network connections, transfers, and protocol clients
    - authentication material and any private key handling
    - shell execution, child processes, and privilege expansion
    - shared runtime, iamine-agent-runtime, iamine-agents, and iamine-core changes
    - the shared official_agent_execution composition
    - model execution, scheduling, transport, worker lifecycle, and inference behavior
    - dashboard, client, packaging, registry, marketplace, and public beta behavior
    - Development authorization, implementation, and merge for this subject

