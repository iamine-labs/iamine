intent:
  data_class: SOURCE
  problem: An operator who already selected a file share cannot verify a declared read-only boundary from a redacted summary without risking discovery, mounting, or file access.
  expected_outcome: A bounded local_readonly review of operator-supplied redacted share metadata that refuses or hands off every filesystem, network, authentication, and execution request.

