    - docs/architecture/hid-shadow-mode.md
    - docs/qa/hid-shadow-mode.md
  exclude:
    - product behavior and product security
    - automatic merge, authorization, or model routing
    - database, server, dashboard, SaaS, MCP, or orchestrator
    - cryptographic event log and historical migration
    - LAN-FILE-SHARE-ASSISTANT-AGENT-001 implementation
    - Approval Capsule UI or general-purpose control-plane CLI

risk:
  data_class: SOURCE
  level: RISK_1
  reasons:
    - changes remain local, process-only, and reconstructible
    - the isolated Git ref uses compare-and-swap but remains operator-rewritable
    - privacy false negatives and Git coupling require explicit limitations
    - shadow observations must never become workflow authority

