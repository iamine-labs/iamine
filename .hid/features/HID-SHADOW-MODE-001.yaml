intent:
  data_class: SOURCE
  problem: Operational gate statuses still depend on subject manifest mutation and conflate review verdicts with human merge decisions.
  expected_outcome: Derive gate outcomes, lifecycle state and capsule eligibility from typed external facts while preserving the exact candidate and historical human authorization.

