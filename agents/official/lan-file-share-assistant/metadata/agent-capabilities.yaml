schema: iamine.agent.capabilities.draft-0.1
package_id: iamine.beta.lan-file-share-assistant
capability_id: lan_file_share_readonly_review
capability_version: 0.1.0
declared_task_types:
  - file_share_readonly_review
operations:
  - summarize_operator_approved_share_inventory
  - explain_declared_readonly_boundary
  - highlight_missing_or_unsafe_share_metadata
  - suggest_non_destructive_next_steps
input_classes:
  - operator_selected_share_summary
  - redacted_share_inventory_summary
  - redacted_access_error_summary
output_classes:
  - file_share_review
  - blocked_action_report
  - clarification_request
  - handoff_request
  - refusal_report
execution_modes:
  - local_readonly
limitations:
  - no_credential_handling
  - no_filesystem_access
  - no_network_access
  - no_raw_text
  - no_share_discovery
risk_profile:
  labels:
    - bounded_readonly
    - operator_review_required
    - pre_network
  expands_scope: false
  grants_permissions: false
  claims_scheduler_priority: false
  claims_trust_or_reputation: false
review:
  requires_human_review: true
  self_approval_allowed: false
  evidence:
    - review/capability-review.md
