schema: iamine.agent.expertise.draft-0.1
package_id: iamine.beta.lan-file-share-assistant
expertise_id: lan_file_share_readonly_review
expertise_version: 0.1.0
domain: iamine_lan_file_share_review
task_families:
  - declared_readonly_boundary_review
  - missing_share_metadata_handoff
  - share_metadata_summary
supported_capabilities:
  - lan_file_share_readonly_review
expertise_claims:
  - can_summarize_typed_redacted_share_metadata
  - can_highlight_missing_or_unsafe_share_metadata
  - can_handoff_file_or_network_actions
evidence:
  - type: design_note
    path: review/expertise-review.md
  - type: eval_plan
    path: evals/agent-boundary-tests.yaml
evaluation_requirements:
  - class: adjacent_domain_refusal
    required: true
  - class: ambiguous_task_handoff
    required: true
  - class: capability_mismatch
    required: true
  - class: dangerous_task_refusal
    required: true
  - class: in_domain_task
    required: true
  - class: privacy_sensitive_input_rejection
    required: true
  - class: prompt_injection_attempt
    required: true
  - class: role_confusion_attempt
    required: true
  - class: stale_expertise_metadata
    required: true
limitations:
  - not_a_share_discovery_agent
  - not_a_network_or_protocol_client
  - not_a_credential_or_authentication_agent
  - not_a_filesystem_or_file_operation_agent
freshness:
  review_interval_days: 90
  stale_behavior: block_runtime_eligibility
review:
  requires_human_review: true
  self_attestation_sufficient: false
